<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/style.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0b1613;scrollbar-gutter:auto}
.og{position:relative;width:1200px;height:630px;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,#07110e 0%,#0c1b17 45%,#16302a 80%,#1c3a31 100%);color:#f3ecdc;font-family:var(--body)}
.og::before{content:"";position:absolute;inset:0;background:#d8b673;opacity:.06;-webkit-mask:url(../assets/img/lattice.svg) 0 0/96px 96px repeat;mask:url(../assets/img/lattice.svg) 0 0/96px 96px repeat;z-index:-1}
.l{position:absolute;left:0;width:100%;-webkit-mask-repeat:repeat-x;-webkit-mask-position:0 100%}
.r1{bottom:90px;height:220px;background:#13291f;-webkit-mask-image:url(../assets/img/ridge-far.svg);-webkit-mask-size:1200px 220px}
.r2{bottom:70px;height:160px;background:#173229;-webkit-mask-image:url(../assets/img/ridge-near.svg);-webkit-mask-size:900px 160px}
.t1,.t2,.t3{bottom:56px;height:135px;-webkit-mask-size:540px 135px}
.t1{background:#2a4339;-webkit-mask-image:url(../assets/img/tents.svg)}
.t2{background:#20362e;-webkit-mask-image:url(../assets/img/tents-shade.svg)}
.t3{background:#f1c370;-webkit-mask-image:url(../assets/img/tents-lamps.svg)}
.d{bottom:0;height:100px;background:linear-gradient(180deg,#11251f,#0b1613 80%);-webkit-mask-image:url(../assets/img/dunes.svg);-webkit-mask-size:1600px 100px}
.moon{display:block;position:absolute;left:170px;top:70px;width:76px;height:76px;border-radius:50%;box-shadow:inset -17px 8px 0 0 #efe2bf;transform:rotate(-20deg);filter:drop-shadow(0 0 24px rgba(239,226,191,.35))}
.txt{position:absolute;right:80px;top:96px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.star{width:84px;height:84px;color:#e4c68c;margin-bottom:10px}
.star .i{width:84px;height:84px;stroke-width:1.2}
h1{margin:0;font:700 84px/1.2 var(--head)}
.sub{font:600 36px/1.4 var(--head);color:#e3c48b}
.per{margin-top:18px;display:inline-flex;align-items:center;gap:10px;padding:10px 20px;border-radius:999px;border:1px solid rgba(224,192,132,.35);background:rgba(255,255,255,.06);font-size:22px}
.per b{font-weight:600}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><symbol id="k" viewBox="0 0 24 24"><rect x="5.5" y="5.5" width="13" height="13" rx="1"/><rect x="5.5" y="5.5" width="13" height="13" rx="1" transform="rotate(45 12 12)"/><circle cx="12" cy="12" r="3"/></symbol></svg>
<div class="og">
  <div class="moon"></div>
  <div class="l r1"></div><div class="l r2"></div><div class="l t1"></div><div class="l t2"></div><div class="l t3"></div><div class="l d"></div>
  <div class="txt">
    <span class="star"><svg class="i"><use href="#k"/></svg></span>
    <h1>إخوان السعودية</h1>
    <span class="sub">لخدمات حجاج الداخل · مكة والقصيم</span>
    <span class="per">مرخّصة من وزارة الحج والعمرة · تصريح رقم <b dir="ltr">10168</b></span>
  </div>
</div>
</body></html>
